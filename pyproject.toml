[project]
name = "metodos-numericos-uta"
version = "0.1.0"
description = "Aplicativo de metodos numericos - UTA FISEI, Software Nivel 3"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sympy>=1.13",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.methods", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
